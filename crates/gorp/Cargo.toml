[package]
name = "gorp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
description = "gorp: a semantic grep for agents"

# One name. `sg` and `semgrep` both shipped through §35 — the first collides
# with ast-grep and the setgroups(1) builtin, the second with the SAST tool
# this is not. `gorp` is four characters, unclaimed, and says what the engine
# does: a bag of words, grepped.
[[bin]]
name = "gorp"
path = "src/main.rs"

[features]
default = ["func-chunk"]
func-chunk = ["gorp-core/func-chunk"]
# The opt-in per-repo daemon (docs in bog-kit: gorp-daemon-workplan.md):
# fold-backed, bog-serve-fronted, spawn-or-connect from the warm path. Off by
# default so the standalone build is byte-for-byte what it always was.
daemon = [
    "dep:fold",
    "dep:bog-serve",
    "dep:anny",
    "dep:ese",
    "dep:serde",
    "dep:schemars",
    "gorp-core/daemon",
]

[dependencies]
gorp-core = { path = "../gorp-core", default-features = false }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
# For `-g`/`--include`: the same glob semantics ripgrep uses, so a caller's
# muscle memory transfers. Already in the tree via gorp-core's walk.
ignore = { workspace = true }
fold = { workspace = true, optional = true }
bog-serve = { workspace = true, optional = true }
anny = { workspace = true, optional = true }
ese = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
schemars = { version = "1", optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.27.0"
