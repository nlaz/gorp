[workspace]
resolver = "2"
members = ["crates/semgrep-core", "crates/semgrep"]

[workspace.dependencies]
anny = { path = "../anny" }
# dim-256, not ese's default dim-512: the model is MRL-trained, so a prefix of
# the vector is itself a valid embedding. Halves the binary (72.8 -> 39.0 MB)
# and emb.bin (kernel index 1.3 GB -> 918 MB). Measured cost is below what the
# agent eval can resolve — files tied with rg, function-level edge intact
# (RESEARCH.md §10.7).
ese = { path = "../ese", default-features = false, features = ["rayon", "dim-256"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
rayon = "1"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4

# keep hot crates fast in dev so tests on real corpora are usable
[profile.dev.package.ese]
opt-level = 2
[profile.dev.package.anny]
opt-level = 2
[profile.dev.package.semgrep-core]
opt-level = 2
