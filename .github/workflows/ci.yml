name: ci

# PREREQUISITE: this workspace builds against sibling checkouts of the Bog
# stack (`../ese`, `../anny`). The canonical repos live in the flowercomputers
# org, which this account can read but not write and whose forking is
# disabled — so CI builds from the nlaz/ese and nlaz/anny mirrors, kept in
# sync by pushing the local checkouts. The `BOG_TOKEN` secret must grant
# `contents: read` on those mirrors.
#
# The first build downloads the ese weight table over the network (~40 MB into
# OUT_DIR); the cargo cache below keeps that to once per lockfile change.

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gorp
      - uses: actions/checkout@v4
        with:
          repository: nlaz/ese
          path: ese
          token: ${{ secrets.BOG_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: nlaz/anny
          path: anny
          token: ${{ secrets.BOG_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gorp/target
          key: cargo-${{ runner.os }}-${{ hashFiles('gorp/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: format
        working-directory: gorp
        run: cargo fmt --check

      - name: clippy
        working-directory: gorp
        run: cargo clippy --workspace --all-targets

      # The func-chunk feature is a supported degradation mode; keep the
      # featureless build compiling (it broke once — a misplaced cfg gate).
      - name: check no-default-features
        working-directory: gorp
        run: cargo check --workspace --no-default-features

      - name: test
        working-directory: gorp
        run: cargo test --workspace

      # The behavior tripwire (PLAN.md Pass 5): ranked output over the frozen
      # fixture corpus must be byte-identical. A commit that changes ranking
      # has to re-record it deliberately.
      - name: snapshot
        working-directory: gorp
        run: |
          cargo build --release
          tools/snapshot.sh --check

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Explicit file list, not the directory: eval/data holds multi-gigabyte
      # third-party checkouts whose syntax is not our problem (and whose
      # warnings would bury ours). The agent harnesses moved to gorp-bench.
      - name: compile
        run: python -m compileall -q eval/*.py eval/sim/*.py eval/tests/*.py

      # The scorers decide every published number in RESEARCH.md. The rg
      # baseline tests shell out to ripgrep, so make sure it exists rather
      # than trusting the runner image's tool list.
      - name: test
        run: |
          command -v rg >/dev/null || sudo apt-get install -y ripgrep
          python -m pip install --quiet pytest
          python -m pytest eval/tests -q
