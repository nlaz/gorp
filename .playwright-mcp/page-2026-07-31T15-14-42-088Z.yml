    - 'heading "Read-repair: keeping a cached answer true of a tree that moved" [level=1] [ref=f4e4]'
    - paragraph [ref=f4e5]: The index describes the corpus as it was. The corpus is as it is. Read-repair is the thing that closes that gap on every query â€” and the reason it gets expensive is visible once you follow what it actually does.
  - generic [ref=f4e6]:
    - paragraph [ref=f4e7]: The premise
    - heading "Why anything has to happen at all" [level=2] [ref=f4e8]
    - paragraph [ref=f4e9]: semgrep's index is a cache, and a cache of a directory goes stale the moment anyone saves a file.
    - paragraph [ref=f4e10]: "A warm search ranks over chunks recorded when the index was built: line spans, a BM25 posting list, and a matrix of embeddings. None of that is re-read at query time â€” the whole point is that it isn't. So if a file changed since the build, the index will happily rank a chunk of it, and the hit will point at lines that now contain something else. If a file was deleted, it will point at a file that isn't there."
    - paragraph [ref=f4e11]: "The engine's contract is that a warm answer and a cold answer are the same answer. Read-repair is what makes that true without rebuilding: before serving from an index, work out what drifted, and patch around it."
