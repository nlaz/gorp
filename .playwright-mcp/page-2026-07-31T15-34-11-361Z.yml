    - paragraph [ref=f6e209]:
      - strong [ref=f6e210]: Who writes.
      - text: "fjall is single-writer. Two semgrep processes cannot both update the overlay. The clean answer is: try to acquire the writer; if another process holds it, fall back to today's in-memory repair for this one query. Correctness is preserved either way, and the fallback path is code that already exists and is already tested."
    - paragraph [ref=f6e211]:
      - strong [ref=f6e212]: When to compact.
      - text: The overlay grows with every edit and eventually the base is mostly superseded. That is where a threshold belongs â€” when overlay chunks exceed some share of base chunks, rebuild the base and drop the overlay. Off the query path, or on it once, rather than on every query forever.
    - paragraph [ref=f6e213]:
      - strong [ref=f6e214]: What invalidates it.
      - text: If the base is rebuilt, every overlay row refers to a chunk table that no longer exists. The
      - code [ref=f6e215]: base_build_id
      - text: "row is the catch: mismatch means drop the overlay wholesale. Cheap, and the failure mode is a slow query rather than a wrong answer."
