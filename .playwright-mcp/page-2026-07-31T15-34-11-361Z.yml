    - heading "Why the agent loop is the real argument" [level=3] [ref=f6e164]
    - paragraph [ref=f6e165]: In a branch switch, a threshold does most of the job â€” one big change, one rebuild, done. The overlay wins, but not dramatically.
    - paragraph [ref=f6e166]:
      - text: The agent loop is different, and it is the case semgrep exists to serve. Edit a file, search, edit, search. Because nothing is ever written back,
      - strong [ref=f6e167]: drift accumulates against the original index
      - text: â€” the tenth query pays to re-embed all ten edited files, the fiftieth pays for fifty. Cost grows with the square of session length. A 5% threshold does not help until query 43, and then only by paying for a full rebuild.
    - paragraph [ref=f6e168]:
      - text: "A durable overlay makes each edit cost once. The session goes from quadratic to linear, and the threshold becomes what it should have been all along: a"
